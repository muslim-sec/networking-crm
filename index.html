<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Network CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ─── BASE ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0a0c;
      --surface:  #111114;
      --card:     #17171b;
      --border:   #1e1e24;
      --border2:  #2a2a33;
      --text:     #e8e8f0;
      --muted:    #6b6b80;
      --accent:   #6d28d9;
      --accent2:  #7c3aed;
      --green:    #10b981;
      --red:      #ef4444;
      --amber:    #f59e0b;
      --blue:     #3b82f6;
      --cyan:     #06b6d4;
    }

    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }

    /* ─── SCROLLBAR ─── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    /* ─── LAYOUT ─── */
    #layout { display: flex; flex: 1; overflow: hidden; }

    /* ─── SIDEBAR ─── */
    #sidebar {
      width: 220px; flex-shrink: 0; background: var(--surface);
      border-right: 1px solid var(--border); display: flex; flex-direction: column;
      padding: 0; overflow: hidden;
    }
    .sidebar-logo {
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 15px; font-weight: 700; letter-spacing: -0.3px;
      color: var(--text);
    }
    .sidebar-logo span { color: var(--accent2); }
    .sidebar-nav { flex: 1; padding: 12px 8px; }
    .nav-btn {
      width: 100%; display: flex; align-items: center; gap: 10px;
      padding: 9px 10px; border-radius: 8px; border: none; background: transparent;
      color: var(--muted); font-size: 13.5px; font-weight: 500; cursor: pointer;
      text-align: left; transition: all 0.15s ease;
    }
    .nav-btn:hover { color: var(--text); background: var(--card); }
    .nav-btn.active { color: var(--text); background: var(--border2); }
    .nav-btn .icon { width: 18px; text-align: center; font-size: 14px; }
    .sidebar-file-section { padding: 12px 8px; border-top: 1px solid var(--border); }
    .file-pill {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px;
      border-radius: 8px; background: var(--card); border: 1px solid var(--border);
      font-size: 12px; color: var(--muted); cursor: pointer; transition: all 0.15s;
    }
    .file-pill:hover { border-color: var(--accent); color: var(--text); }
    .file-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); flex-shrink: 0; }
    .file-dot.loaded { background: var(--green); }

    /* ─── MAIN ─── */
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* ─── TOPBAR ─── */
    #topbar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 12px 20px; display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .topbar-title { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
    .topbar-actions { display: flex; gap: 8px; align-items: center; }
    input.search {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 12px; font-size: 13px; color: var(--text);
      outline: none; width: 220px; transition: border-color 0.15s;
    }
    input.search:focus { border-color: var(--accent); }
    input.search::placeholder { color: var(--muted); }
    input.search:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent); color: #fff; border: none; border-radius: 8px;
      padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all 0.15s; display: flex; align-items: center; gap: 6px;
    }
    .btn-primary:hover { background: var(--accent2); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* ─── CONTENT ─── */
    #content { flex: 1; overflow-y: auto; padding: 20px; }

    /* ─── DASHBOARD ─── */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .stat-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 18px; position: relative; overflow: hidden;
      animation: fadeUp 0.3s ease both;
    }
    .stat-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--accent), transparent);
    }
    .stat-card .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
    .stat-card .stat-value { font-size: 32px; font-weight: 700; letter-spacing: -1px; line-height: 1; }
    .stat-card .stat-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

    .dash-section-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }

    /* ─── CATEGORY BREAKDOWN ─── */
    .cat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; margin-bottom: 24px; }
    .cat-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 14px; animation: fadeUp 0.3s ease both;
    }
    .cat-card .cat-name { font-size: 12px; font-weight: 600; margin-bottom: 6px; }
    .cat-card .cat-count { font-size: 22px; font-weight: 700; }
    .cat-card .cat-bar { height: 3px; border-radius: 2px; margin-top: 8px; background: var(--border2); }
    .cat-card .cat-bar-fill { height: 3px; border-radius: 2px; transition: width 0.6s ease; }

    /* ─── PEOPLE LIST ─── */
    .people-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
    .person-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; cursor: pointer; transition: all 0.2s ease;
      animation: fadeUp 0.3s ease both; position: relative; overflow: hidden;
    }
    .person-card::after {
      content: ''; position: absolute; inset: 0; border-radius: 12px;
      background: linear-gradient(135deg, rgba(109,40,217,0.06), transparent);
      opacity: 0; transition: opacity 0.2s;
    }
    .person-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(109,40,217,0.15); }
    .person-card:hover::after { opacity: 1; }
    .avatar-img { width: 100%; height: 100%; border-radius: inherit; object-fit: cover; }
    .person-avatar {
      width: 40px; height: 40px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; color: #fff;
      margin-bottom: 12px; flex-shrink: 0;
    }
    .person-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .person-role { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
    .person-skills { display: flex; flex-wrap: wrap; gap: 4px; }
    .skill-tag {
      font-size: 10.5px; padding: 2px 8px; border-radius: 20px;
      background: rgba(109,40,217,0.15); color: #a78bfa; border: 1px solid rgba(109,40,217,0.2);
    }
    .skill-tag.green { background: rgba(16,185,129,0.12); color: #6ee7b7; border-color: rgba(16,185,129,0.2); }
    .skill-tag.blue { background: rgba(59,130,246,0.12); color: #93c5fd; border-color: rgba(59,130,246,0.2); }
    .skill-tag.amber { background: rgba(245,158,11,0.12); color: #fcd34d; border-color: rgba(245,158,11,0.2); }
    .person-meta { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--muted); display: flex; gap: 12px; }

    /* ─── SKILLS ─── */
    .skills-cat-section { margin-bottom: 24px; }
    .skills-cat-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .skills-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .skill-pill {
      padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 500;
      border: 1px solid var(--border2); color: var(--text); background: var(--card);
      transition: all 0.15s; cursor: default;
    }
    .skill-pill:hover { border-color: var(--accent); color: #a78bfa; }

    /* ─── CARD FIELD CHOOSER ─── */
    .field-chooser-wrapper { position: relative; display: inline-flex; align-items: center; }
    .field-chooser-btn { background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; padding: 4px; border-radius: 6px; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 28px; height: 28px;}
    .field-chooser-btn:hover { color: var(--text); background: var(--hover); }
    .field-chooser-panel {
      position: absolute; right: 0; top: 100%; margin-top: 8px; width: 200px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 100;
      display: none; flex-direction: column; gap: 4px;
    }
    .field-chooser-panel.open { display: flex; animation: fadeUp 0.2s ease; }
    .field-chooser-item {
      display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 6px 8px;
      border-radius: 6px; cursor: pointer; color: var(--text);
    }
    .field-chooser-item:hover { background: var(--hover); }
    .field-chooser-item input { accent-color: var(--accent); cursor: pointer; }

    /* ─── EDIT MODE ─── */
    .dp-edit-btn { background: none; border: none; font-size: 15px; cursor: pointer; color: var(--muted); padding: 4px; border-radius: 6px; transition: 0.2s; margin-left: 8px; display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; }
    .dp-edit-btn:hover { color: var(--text); background: var(--hover); }
    .dp-edit-btn.active { color: var(--accent); background: rgba(109,40,217,0.15); }
    .dp-edit-input, .dp-edit-textarea, .dp-edit-select {
      width: 100%; background: rgba(0,0,0,0.1); border: 1px solid var(--border2); color: var(--text);
      font-size: 13px; padding: 6px 8px; border-radius: 6px; outline: none; font-family: inherit; transition: border-color 0.2s;
    }
    .dp-edit-select { background: var(--surface); }
    .dp-edit-input:focus, .dp-edit-textarea:focus, .dp-edit-select:focus { border-color: var(--accent); background: rgba(0,0,0,0.2); }
    .dp-edit-textarea { resize: vertical; min-height: 50px; }
    
    /* ─── CHIPS & PILLS ─── */
    .view-pill {
      display: inline-block; padding: 4px 10px; background: rgba(109,40,217,0.1); 
      color: var(--accent); border-radius: 14px; font-size: 12px; font-weight: 600; margin: 2px;
    }
    .chip-container {
      display: flex; flex-wrap: wrap; gap: 6px; padding: 6px;
      border: 1px solid var(--border2); border-radius: 6px; background: rgba(0,0,0,0.1);
      min-height: 38px; align-items: center;
    }
    .chip-container:focus-within { border-color: var(--accent); background: rgba(0,0,0,0.2); }
    .chip-badge {
      display: flex; align-items: center; gap: 4px; padding: 4px 8px;
      background: var(--accent); color: #fff; border-radius: 12px; font-size: 12px; font-weight: 500;
    }
    .chip-badge-remove { cursor: pointer; font-weight: bold; opacity: 0.7; }
    .chip-badge-remove:hover { opacity: 1; }
    .chip-input {
      flex: 1; min-width: 60px; border: none; background: transparent; outline: none;
      color: var(--text); font-size: 14px;
    }
    .dp-save-bar {
      position: sticky; bottom: 0; background: var(--card); padding: 16px 24px; border-top: 1px solid var(--border);
      display: flex; justify-content: flex-end; align-items: center; gap: 12px; z-index: 10; margin: 0 -24px -24px -24px;
    }

    /* ─── EMPTY / ONBOARD ─── */
    .onboard {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; gap: 16px; text-align: center; padding: 40px;
    }
    .onboard-icon { font-size: 48px; opacity: 0.3; }
    .onboard h2 { font-size: 20px; font-weight: 600; }
    .onboard p { font-size: 14px; color: var(--muted); max-width: 340px; }
    .onboard .btn-load-big {
      margin-top: 8px; background: var(--accent); color: #fff; border: none; border-radius: 10px;
      padding: 11px 22px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .onboard .btn-load-big:hover { background: var(--accent2); transform: translateY(-1px); }

    /* ─── MODAL ─── */
    #modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
      z-index: 100; display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    #modal-overlay.open { opacity: 1; pointer-events: all; }
    #modal-box {
      background: var(--surface); border: 1px solid var(--border2); border-radius: 16px;
      width: min(900px, 95vw); max-height: 95dvh; overflow-y: auto;
      transform: scale(0.96) translateY(8px); transition: transform 0.2s;
    }
    #modal-overlay.open #modal-box { transform: scale(1) translateY(0); }
    .modal-header { padding: 18px 20px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-size: 15px; font-weight: 600; }
    .modal-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 2px 6px; border-radius: 6px; transition: color 0.15s; }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 20px; display: grid; gap: 16px; }
    .modal-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .modal-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-label { font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .form-input, .form-textarea, .form-select {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 10px; font-size: 13px; color: var(--text); outline: none;
      transition: border-color 0.15s; font-family: inherit;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--accent); }
    .form-textarea { resize: vertical; min-height: 72px; }
    .form-select option { background: var(--surface); }
    .modal-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 7px 14px; font-size: 13px; color: var(--muted); cursor: pointer; transition: all 0.15s; }
    .btn-ghost:hover { color: var(--text); border-color: var(--border2); }

    /* ─── SKILL SELECT ─── */
    .skill-select-area { border: 1px solid var(--border); border-radius: 8px; padding: 10px; max-height: 160px; overflow-y: auto; }
    .skill-checkbox { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
    .skill-checkbox input { accent-color: var(--accent); cursor: pointer; }
    .skill-checkbox span { font-size: 12.5px; }

    /* ─── PERSON DETAIL (slide-in panel) ─── */
    #detail-panel {
      position: fixed; top: 0; right: -440px; width: 440px; height: 100dvh;
      background: var(--surface); border-left: 1px solid var(--border);
      z-index: 90; overflow-y: auto; transition: right 0.3s cubic-bezier(0.16,1,0.3,1);
    }
    #detail-panel.open { right: 0; }
    .detail-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-between; }
    .detail-avatar { width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg, var(--accent), var(--cyan)); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: #fff; }
    .detail-info { flex: 1; margin-left: 14px; }
    .detail-name { font-size: 17px; font-weight: 700; }
    .detail-role { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .detail-body { padding: 20px; display: flex; flex-direction: column; gap: 18px; }
    .detail-section-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
    .detail-row { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; }
    .detail-row-label { color: var(--muted); min-width: 80px; flex-shrink: 0; }
    .detail-row-val { color: var(--text); word-break: break-word; }
    .detail-row-val a { color: var(--accent2); text-decoration: none; }
    .detail-row-val a:hover { text-decoration: underline; }

    /* ─── ANIMATIONS ─── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }

    /* ─── CRM v2 FEATURES ─── */
    .health-dot {
      position: absolute; top: 16px; right: 16px; width: 10px; height: 10px; border-radius: 50%;
    }
    .health-dot.green { background: var(--green); box-shadow: 0 0 8px rgba(16,185,129,0.4); }
    .health-dot.amber { background: var(--amber); box-shadow: 0 0 8px rgba(245,158,11,0.4); }
    .health-dot.red { background: var(--red); box-shadow: 0 0 8px rgba(239,68,68,0.4); }
    .health-dot.grey { background: var(--muted); }

    .interaction-list { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; max-height: 300px; overflow-y: auto; padding-right: 4px; }
    .interaction-entry {
      background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--accent);
      border-radius: 8px; padding: 12px; font-size: 13px;
    }
    .interaction-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .interaction-date { font-weight: 600; color: var(--muted); font-size: 11.5px; }
    .interaction-type-badge {
      font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: rgba(109,40,217,0.15); color: #a78bfa;
    }

    /* ─── CRM v3 FEATURES ─── */
    .dp-skill-pill { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; margin: 2px; border: 1px solid; }
    .static-row { display: flex; padding: 10px 0; border-bottom: 1px solid var(--border2); align-items: flex-start; position: relative; }
    .static-row:last-child { border-bottom: none; }
    .static-row-label { width: 140px; flex-shrink: 0; color: var(--muted); font-size: 13px; font-weight: 500; padding-top: 2px; }
    .static-row-val { flex: 1; font-size: 14px; min-width: 0; word-wrap: break-word; padding-right: 24px; }
    .static-row-empty { color: var(--muted); opacity: 0.5; }
    .copy-btn { 
      opacity: 0; cursor: pointer; padding: 4px; color: var(--muted); font-size: 14px; border-radius: 4px; transition: 0.2s; position: absolute; right: 0; top: 8px;
    }
    .static-row:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { color: var(--text); background: var(--border); }
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 9999; }
    #toast.show { opacity: 1; bottom: 30px; }
    .skill-delete-btn { display: none; cursor: pointer; margin-left: 6px; font-size: 14px; line-height: 1; opacity: 0.7; }
    .skill-delete-btn:hover { opacity: 1; }
    .skill-pill:hover .skill-delete-btn { display: inline; }
    .cat-rename-input { background: var(--surface); color: var(--text); border: 1px solid var(--border2); border-radius: 4px; font-size: 14px; font-weight: 700; padding: 2px 6px; outline: none; }
    .drop-zone-active { background: rgba(255,255,255,0.05); border-radius: 8px; }

    /* ─── UTILS ─── */
    .hidden { display: none !important; }
    .empty-msg { text-align: center; color: var(--muted); font-size: 14px; padding: 40px; }
  </style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="liquid-phone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" /><stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="liquid-email" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" /><stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="liquid-name" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" /><stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="liquid-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" /><stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="liquid-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" /><stop offset="100%" stop-color="#14b8a6" />

  <script>
  // ─── STATE ─────────────────────────────────────────────────────
  let db = null;
  let fileHandle = null;
  let currentView = 'dashboard';
  let searchQuery = '';

  // ─── CRM v3 HELPERS ─────────────────────────────────────────────
  function getArray(p, field) {
    if (!p[field]) return [];
    if (Array.isArray(p[field])) return p[field].filter(Boolean);
    return p[field].toString().split(',').map(s => s.trim()).filter(Boolean);
  }


  window._addSelectChip = function(sel) {
    if (sel.value) {
      const val = sel.value.trim();
      const existing = Array.from(sel.parentElement.querySelectorAll('.chip-badge')).map(b => b.childNodes[0].textContent.trim());
      if (!existing.includes(val)) {
        const badge = document.createElement('span');
        badge.className = 'chip-badge';
        badge.innerHTML = val + ' <span class="chip-badge-remove" onclick="this.parentElement.remove()">✕</span>';
        sel.parentElement.insertBefore(badge, sel);
      }
      sel.value = '';
    }
  };

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1500);
  }

  function copyField(label, val) {
    if (!val) return;
    const cleanLabel = label.replace(/\(s\)/g, ''); // strip (s)
    navigator.clipboard.writeText(`${cleanLabel}: ${val}`).then(() => showToast('Copied!'));
  }

  function buildShareText(p) {
    let text = `Name: ${p['Full Name'] || '—'}\n`;
    if(p['Cybersecurity Role']) text += `Role: ${p['Cybersecurity Role']}\n`;
    
    const phones = getArray(p, 'Phones');
    if(phones.length) text += `Phone: ${phones.join(', ')}\n`;
    else if(p['Phone']) text += `Phone: ${p['Phone']}\n`;

    const emails = getArray(p, 'Emails');
    if(emails.length) text += `Email: ${emails.join(', ')}\n`;
    else if(p['Email']) text += `Email: ${p['Email']}\n`;

    if(p['LinkedIn']) text += `LinkedIn: ${p['LinkedIn']}\n`;
    if(p['GitHub']) text += `GitHub: ${p['GitHub']}\n`;
    if(p['Website']) text += `Website: ${p['Website']}\n`;
    
    return text.trim();
  }

  // ─── CATEGORY COLORS ───────────────────────────────────────────
  const catColors = {
    'Offensive Security': '#ef4444',
    'Research': '#f59e0b',
    'Systems': '#06b6d4',
    'Defensive Security': '#10b981',
    'Defensive/Cloud': '#10b981',
    'Intelligence': '#8b5cf6',
    'Application Security': '#3b82f6',
    'Engineering': '#14b8a6',
    'AI Security': '#f43f5e',
    'AI Engineering': '#a855f7',
    'Full Stack Development': '#22d3ee',
    'Data': '#fb923c',
    'Community': '#84cc16',
    'Design': '#ec4899',
  };

  function catColor(cat) { return catColors[cat] || '#6d28d9'; }

  // ─── FILE SYSTEM ACCESS ─────────────────────────────────────────

  // ─── FILE HANDLE PERSISTENCE ───
  function idbReady() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('crmDB', 1);
      req.onupgradeneeded = e => {
        e.target.result.createObjectStore('handles');
      };
      req.onsuccess = e => resolve(e.target.result);
      req.onerror = () => reject('IDB error');
    });
  }

  async function saveHandleToIDB(handle) {
    try {
      const dbInstance = await idbReady();
      const tx = dbInstance.transaction('handles', 'readwrite');
      tx.objectStore('handles').put(handle, 'crm-file');
    } catch(e) { console.warn(e); }
  }

  async function getHandleFromIDB() {
    try {
      const dbInstance = await idbReady();
      return new Promise((resolve) => {
        const tx = dbInstance.transaction('handles', 'readonly');
        const req = tx.objectStore('handles').get('crm-file');
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      });
    } catch(e) { return null; }
  }

  async function readAndBootFile() {
    try {
      const file = await fileHandle.getFile();
      const text = await file.text();
      db = JSON.parse(text);
      if (!db.people) db.people = [];
      if (!db.interactions) db.interactions = [];
      if (!db.skills) db.skills = [];
      if (!db.organizations) db.organizations = [];
      if (!db.followups) db.followups = [];
      afterLoad();
    } catch (e) {
      console.error(e);
      alert("Failed to read the file. It might have been moved or deleted.");
      document.getElementById('btn-resume-session').style.display = 'none';
      document.getElementById('btn-load-onboard').style.display = 'inline-block';
    }
  }

  async function loadFile() {
    if (!window.showOpenFilePicker) {
      alert('Please open this file in Chrome or Edge (File System Access API required).');
      return;
    }
    try {
      [fileHandle] = await window.showOpenFilePicker({
        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
      });
      await saveHandleToIDB(fileHandle);
      await readAndBootFile();
    } catch (e) {
      if (e.name !== 'AbortError') console.error(e);
    }
  }

  // ─── AVATAR COMPRESSOR ───
  function processImageUpload(file) {
    return new Promise((resolve, reject) => {
      if (file.size > 5 * 1024 * 1024) {
        showToast("This is over than the max size");
        return reject("Size limit exceeded");
      }
      if (!file.type.match(/image\/(jpeg|png|webp)/)) {
        showToast("This format is not supported");
        return reject("Invalid format");
      }
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 150;
          let w = img.width, h = img.height;
          if (w > h) { if (w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; } }
          else { if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; } }
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.8));
        };
        img.onerror = () => reject("Image load error");
        img.src = e.target.result;
      };
      reader.onerror = () => reject("File read error");
      reader.readAsDataURL(file);
    });
  }

  async function saveFile() {
    if (!fileHandle) return;
    try {
      const perm = await fileHandle.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted') {
        const req = await fileHandle.requestPermission({ mode: 'readwrite' });
        if (req !== 'granted') { alert('Write permission denied.'); return; }
      }
      const writable = await fileHandle.createWritable();
      await writable.write(JSON.stringify(db, null, 2));
      await writable.close();
    } catch (e) {
      alert('Save failed: ' + e.message);
    }
  }

  // ─── AFTER LOAD ─────────────────────────────────────────────────
  function afterLoad() {
    // update sidebar pill
    document.getElementById('file-dot').classList.add('loaded');
    document.getElementById('file-label').textContent = 'crm-data.json';
    // enable controls
    document.getElementById('search-input').disabled = false;
    document.getElementById('btn-add').disabled = false;
    // hide onboard
    document.getElementById('onboard').classList.add('hidden');
    renderView(currentView);
  }

  // ─── ROUTING ─────────────────────────────────────────────────────
  function renderView(view) {
    currentView = view;
    ['dashboard', 'people', 'skills'].forEach(v => {
      document.getElementById('view-' + v).classList.add('hidden');
    });
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('[data-view="' + view + '"]').classList.add('active');

    const titles = { dashboard: 'Dashboard', people: 'People', skills: 'Skills' };
    document.getElementById('view-title').textContent = titles[view];

    const searchRow = document.getElementById('search-input');
    searchRow.style.display = view === 'people' ? '' : 'none';

    if (!db) return;
    document.getElementById('view-' + view).classList.remove('hidden');
    if (view === 'dashboard') renderDashboard();
    else if (view === 'people') renderPeople();
    else if (view === 'skills') renderSkills();
  }

  // ─── EDIT MODE ───
  let editingPersonId = null;

  function toggleEditMode(p) {
    if (editingPersonId === p['Person ID']) {
      editingPersonId = null;
      openDetailPanel(p);
    } else {
      editingPersonId = p['Person ID'];
      renderDetailEdit(p);
    }
  }

  function renderDetailEdit(p) {
    document.getElementById('btn-detail-edit').classList.add('active');
    const sList = personSkills(p);
    
    // Checkboxes for skills
    let skillHtml = '<div style="display:flex; flex-wrap:wrap; gap:8px;">';
    db.skills.forEach(sk => {
      const nm = sk['Skill / Specialization'];
      const ch = sList.includes(nm) ? 'checked' : '';
      skillHtml += `<label style="font-size:12px; display:flex; align-items:center; gap:4px;"><input type="checkbox" class="edit-skill-cb" value="${nm}" ${ch}> ${nm}</label>`;
    });
    skillHtml += '</div>';

    const getArrOrLegacy = (key, legacyKey) => getArray(p, key).length ? getArray(p, key) : (p[legacyKey] ? [p[legacyKey]] : []);
    
    const rows = [
      {k: 'Full Name', key: 'Full Name', val: p['Full Name'] || '', type: 'input'},
      {k: 'AKA', key: 'Preferred Name', val: p['Preferred Name'] || '', type: 'input'},
      {k: 'Role / Title', key: 'Cybersecurity Role', val: p['Cybersecurity Role'] || p['Current Title'] || '', type: 'input'},
      {k: 'Experience', key: 'Experience Level', val: p['Experience Level'] || '', type: 'select', opts: ['Junior','Mid','Senior','Lead','Expert']},
      {k: 'Company', key: 'Current Company', val: p['Current Company'] || '', type: 'input'},
      {k: 'Status', key: 'Status', val: p['Status'] || '', type: 'select', opts: ['Active','Passive','Lost Touch','VIP']},
      {k: 'Phone(s)', key: 'Phones', val: getArrOrLegacy('Phones', 'Phone'), type: 'tags'},
      {k: 'Email(s)', key: 'Emails', val: getArrOrLegacy('Emails', 'Email'), type: 'tags'},
      {k: 'Location', key: 'Location', val: p['Location'] || '', type: 'input'},
      {k: 'Languages', key: 'Languages', val: getArray(p, 'Languages'), type: 'tags-select', opts: ['Arabic 🇸🇦', 'English 🇬🇧', 'French 🇫🇷']},
      {k: 'Telegram(s)', key: 'Telegrams', val: getArrOrLegacy('Telegrams', 'Telegram'), type: 'tags'},
      {k: 'Discord(s)', key: 'Discords', val: getArrOrLegacy('Discords', 'Discord'), type: 'tags'},
      {k: 'LinkedIn', key: 'LinkedIn', val: p['LinkedIn'] || '', type: 'input'},
      {k: 'GitHub', key: 'GitHub', val: p['GitHub'] || '', type: 'input'},
      {k: 'Website', key: 'Website', val: p['Website'] || '', type: 'input'},
      {k: 'Where Met', key: 'Where Met', val: p['Where Met'] || '', type: 'input'},
      {k: 'Topics', key: 'Topics', val: getArray(p, 'Topics'), type: 'tags'},
      {k: 'Projects', key: 'Projects', val: getArray(p, 'Projects'), type: 'tags'},
      {k: 'Cadence', key: 'Cadence', val: p['Cadence'] || '0', type: 'select', opts: ['0','30','60','90','180','365']},
      {k: 'Goals', key: 'Goals', val: p['Goals'] || '', type: 'textarea'},
      {k: 'Interests', key: 'Interests', val: p['Interests'] || '', type: 'textarea'},
      {k: 'Context', key: 'PersonalContext', val: p['PersonalContext'] || '', type: 'textarea'},
      {k: 'Notes', key: 'Note', val: p['Note'] || p['Notes'] || '', type: 'textarea'}
    ];

    let dpEditAvatarB64 = p.Picture || null;
    window._tempDpAvatar = dpEditAvatarB64;
    window._handleDpAvatarUpload = async function(el) {
      if(!el.files.length) return;
      try {
        window._tempDpAvatar = await processImageUpload(el.files[0]);
        document.getElementById('dp-edit-avatar-preview').src = window._tempDpAvatar;
        document.getElementById('dp-edit-avatar-preview').style.display = 'block';
        document.getElementById('btn-dp-avatar-remove').style.display = 'inline-block';
      } catch(err) { console.log(err); }
    };
    window._handleDpAvatarRemove = function() {
      window._tempDpAvatar = null;
      document.getElementById('dp-edit-avatar-preview').style.display = 'none';
      document.getElementById('btn-dp-avatar-remove').style.display = 'none';
    };

    let bodyHtml = `
      <div class="static-row">
        <div class="static-row-label">Picture</div>
        <div class="static-row-val" style="display:flex; align-items:center; gap:8px;">
          <label for="dp-avatar-input" class="btn" style="cursor:pointer; padding:4px 8px; font-size:12px;">Upload</label>
          <input type="file" id="dp-avatar-input" accept="image/png, image/jpeg, image/webp" style="display:none" onchange="window._handleDpAvatarUpload(this)">

          <span class="btn-ghost" id="btn-dp-avatar-remove" style="cursor:pointer; font-size:12px; color:var(--red); display:${dpEditAvatarB64 ? 'inline-block' : 'none'};" onclick="window._handleDpAvatarRemove()">Remove</span>
          <img id="dp-edit-avatar-preview" class="avatar-img" src="${dpEditAvatarB64 || ''}" style="width:30px; height:30px; border-radius:6px; display:${dpEditAvatarB64 ? 'block' : 'none'};">
        </div>
      </div>
    `;

    bodyHtml += rows.map(r => {
      let inputHtml = '';
      if (r.type === 'input') {
        const safeVal = r.val.replace(/"/g, '&quot;');
        inputHtml = `<input type="text" class="dp-edit-input" data-key="${r.key}" value="${safeVal}">`;
      } else if (r.type === 'textarea') {
        const safeVal = r.val.replace(/"/g, '&quot;');
        inputHtml = `<textarea class="dp-edit-textarea" data-key="${r.key}">${safeVal}</textarea>`;
      } else if (r.type === 'select') {
        const opts = r.opts.map(o => `<option value="${o}" ${r.val===o?'selected':''}>${o==='0'?'None':o}</option>`).join('');
        inputHtml = `<select class="dp-edit-select" data-key="${r.key}"><option value=""></option>${opts}</select>`;
      } else if (r.type === 'tags') {
        const chipsHtml = r.val.map(v => `<span class="chip-badge">${v} <span class="chip-badge-remove" onclick="this.parentElement.remove()">✕</span></span>`).join('');
        inputHtml = `
          <div class="chip-container dp-edit-tags" data-key="${r.key}" onclick="this.querySelector('input') && this.querySelector('input').focus()">
            ${chipsHtml}
            <input type="text" class="chip-input" placeholder="Type and press Enter...">
          </div>
        `;
      } else if (r.type === 'tags-select') {
        const chipsHtml = r.val.map(v => `<span class="chip-badge">${v} <span class="chip-badge-remove" onclick="this.parentElement.remove()">✕</span></span>`).join('');
        const selectOpts = r.opts.map(o => `<option value="${o}">${o}</option>`).join('');
        inputHtml = `
          <div class="chip-container dp-edit-tags" data-key="${r.key}">
            ${chipsHtml}
            <select class="chip-select" style="border:none; outline:none; background:transparent; font-size:13px; color:var(--fg); padding:2px; flex:1;" onchange="window._addSelectChip(this)">
              <option value="" disabled selected>Add Language...</option>
              ${selectOpts}
            </select>
          </div>
        `;
      }
      return `
        <div class="static-row">
          <div class="static-row-label">${r.k}</div>
          <div class="static-row-val">${inputHtml}</div>
        </div>`;
    }).join('');




    bodyHtml += `
      <div class="static-row" style="flex-direction:column; align-items:stretch;">
        <div class="static-row-label" style="width:100%; margin-bottom:8px;">Skills</div>
        <div class="static-row-val" style="width:100%; border:1px solid var(--border2); padding:8px; border-radius:6px; background:rgba(0,0,0,0.1)">
          ${skillHtml}
        </div>
      </div>
    `;
    
    bodyHtml += `
      <div class="dp-save-bar">
        <button class="btn" onclick="toggleEditMode(db.people.find(x=>x['Person ID']==='${editingPersonId}'))">Cancel</button>
        <button class="btn btn-primary" onclick="saveDetailEdits('${p['Person ID']}')">Save Changes</button>
      </div>
    `;

    document.getElementById('dp-body').innerHTML = bodyHtml;
  }

  function saveDetailEdits(id) {
    const p = db.people.find(x => x['Person ID'] === id);
    if (!p) return;

    // Collect standard inputs
    document.querySelectorAll('#dp-body .dp-edit-input, #dp-body .dp-edit-textarea, #dp-body .dp-edit-select').forEach(el => {
      const k = el.dataset.key;
      const v = el.value.trim();
      p[k] = v;
    });

    // Collect tags inputs
    document.querySelectorAll('#dp-body .dp-edit-tags').forEach(el => {
      const k = el.dataset.key;
      const badges = Array.from(el.querySelectorAll('.chip-badge')).map(b => b.childNodes[0].textContent.trim());
      if (badges.length) {
        if (k === 'Phones' || k === 'Emails' || k === 'Telegrams' || k === 'Discords') {
          delete p[k.slice(0, -1)]; // delete singular legacy key
        }
        p[k] = badges;
      } else {
        delete p[k];
        if (k === 'Phones' || k === 'Emails' || k === 'Telegrams' || k === 'Discords') {
          delete p[k.slice(0, -1)]; // delete singular legacy key
        }
      }
    });

    // Special fields
    p['Specialization'] = Array.from(document.querySelectorAll('#dp-body .edit-skill-cb:checked')).map(cb => cb.value).join(', ');
    if (window._tempDpAvatar !== undefined) {
      if (window._tempDpAvatar === null) delete p.Picture;
      else p.Picture = window._tempDpAvatar;
    }

    saveFile();
    editingPersonId = null;
    openDetailPanel(p);
    if (currentView === 'dashboard') renderDashboard();
    else if (currentView === 'people') renderPeople();
  }

  // ─── DASHBOARD ───────────────────────────────────────────────────
  function renderDashboard() {
    const el = document.getElementById('view-dashboard');
    const people = db.people || [];
    const skills = db.skills || [];

    // Skill category breakdown from people
    const catCounts = {};
    people.forEach(p => {
      const sArr = personSkills(p);
      sArr.forEach(s => {
        const sk = db.skills.find(sk => sk['Skill / Specialization'] === s);
        const cat = sk ? sk.Category : 'Other';
        catCounts[cat] = (catCounts[cat] || 0) + 1;
      });
    });
    const maxCat = Math.max(1, ...Object.values(catCounts));

    const skillCats = {};
    skills.forEach(s => {
      const cat = s.Category || 'Other';
      skillCats[cat] = (skillCats[cat] || 0) + 1;
    });

    el.innerHTML = `
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-label">Total People</div>
          <div class="stat-value" style="color:#a78bfa">${people.length}</div>
          <div class="stat-sub">in your network</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Skill Categories</div>
          <div class="stat-value" style="color:#6ee7b7">${Object.keys(skillCats).length}</div>
          <div class="stat-sub">tracked domains</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Skills</div>
          <div class="stat-value" style="color:#93c5fd">${skills.length}</div>
          <div class="stat-sub">mapped specializations</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Interactions</div>
          <div class="stat-value" style="color:#fcd34d">${(db.interactions || []).length}</div>
          <div class="stat-sub">logged</div>
        </div>
      </div>

      <div class="dash-section-title">Network by Expertise</div>
      <div class="cat-grid">
        ${Object.entries(skillCats).sort((a,b)=>b[1]-a[1]).map(([cat, cnt]) => {
          const col = catColor(cat);
          const pct = Math.round((cnt / skills.length) * 100);
          return `
            <div class="cat-card" style="animation-delay:${Math.random()*0.2}s">
              <div class="cat-name" style="color:${col}">${cat}</div>
              <div class="cat-count">${cnt}</div>
              <div class="cat-bar"><div class="cat-bar-fill" style="width:${pct}%;background:${col}"></div></div>
            </div>`;
        }).join('')}
      </div>

      ${(() => {
        let overdue = people.filter(p => healthClass(p) === 'red');
        if (!overdue.length) return '';
        overdue.sort((a,b) => nextContactDate(a) - nextContactDate(b));
        return `
          <div class="dash-section-title" style="color:var(--red);">Action Required (Overdue)</div>
          <div class="people-grid" style="margin-bottom: 24px;">
            ${overdue.slice(0, 5).map(renderPersonCard).join('')}
          </div>
        `;
      })()}

      <div class="dash-section-title" style="display:flex; justify-content:space-between; align-items:center;">
        <span>All Contacts</span>
        ${buildFieldChooserHTML('chooser-dash')}
      </div>
      <div class="people-grid">
        ${people.slice(0,6).map(renderPersonCard).join('')}
      </div>
    `;
    attachCardListeners();
  }

  // ─── PEOPLE ───────────────────────────────────────────────────────
  function renderPeople() {
    const el = document.getElementById('view-people');
    const q = searchQuery.toLowerCase();
    const people = (db.people || []).filter(p => {
      if (!q) return true;
      return JSON.stringify(p).toLowerCase().includes(q);
    });

    if (people.length === 0) {
      el.innerHTML = '<div class="empty-msg">No contacts found.</div>';
      return;
    }
    el.innerHTML = `
      <div style="display:flex; justify-content:flex-end; margin-bottom:16px;">
        ${buildFieldChooserHTML('chooser-people')}
      </div>
      <div class="people-grid">${people.map(renderPersonCard).join('')}</div>
    `;
    attachCardListeners();
  }

  // ─── CARD FIELD CHOOSER ───
  let cardFields = JSON.parse(localStorage.getItem('crm_card_fields')) || ['skills', 'phone'];

  function saveCardFields() {
    localStorage.setItem('crm_card_fields', JSON.stringify(cardFields));
    if (currentView === 'dashboard') renderDashboard();
    else if (currentView === 'people') renderPeople();
  }

  function toggleFieldChooser(id) {
    const p = document.getElementById(id);
    if (!p) return;
    p.classList.toggle('open');
  }

  function onFieldChecked(key, checkbox) {
    if (checkbox.checked) {
      if (cardFields.length >= 2) {
        const removed = cardFields.shift();
        const p = checkbox.closest('.field-chooser-panel');
        if (p) {
          const oldCb = p.querySelector(`input[value="${removed}"]`);
          if (oldCb) oldCb.checked = false;
        }
      }
      cardFields.push(key);
    } else {
      cardFields = cardFields.filter(x => x !== key);
    }
    saveCardFields();
    document.querySelectorAll('.field-chooser-panel input').forEach(cb => {
      cb.checked = cardFields.includes(cb.value);
    });
  }

  function buildFieldChooserHTML(panelId) {
    const fields = [
      {k: 'skills', l: 'Skills'}, {k: 'phone', l: 'Phone'}, {k: 'location', l: 'Location'},
      {k: 'email', l: 'Email'}, {k: 'company', l: 'Company'}, {k: 'languages', l: 'Languages'},
      {k: 'telegram', l: 'Telegram'}, {k: 'discord', l: 'Discord'}, {k: 'topics', l: 'Topics'},
      {k: 'projects', l: 'Projects'}, {k: 'cadence', l: 'Cadence'}, {k: 'where_met', l: 'Where Met'}
    ];
    let items = fields.map(f => {
      const ch = cardFields.includes(f.k) ? 'checked' : '';
      return `<label class="field-chooser-item">
        <input type="checkbox" value="${f.k}" ${ch} onchange="onFieldChecked('${f.k}', this)">
        ${f.l}
      </label>`;
    }).join('');
    
    return `
      <div class="field-chooser-wrapper" id="wrap-${panelId}">
        <button class="field-chooser-btn" onclick="toggleFieldChooser('${panelId}')" title="Customize Card Fields">⚙️</button>
        <div class="field-chooser-panel" id="${panelId}">
          <div style="font-size:11px; color:var(--muted); padding:4px; text-transform:uppercase; letter-spacing:0.05em; font-weight:600">Show on cards (pick 2)</div>
          ${items}
        </div>
      </div>
    `;
  }

  function renderPersonCard(p) {
    const initials = (p['Full Name'] || '?').split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
    const role = p['Cybersecurity Role'] || p['Current Title'] || '';

    let dynHtml = cardFields.map(k => {
      if (k === 'skills') {
        const skills = personSkills(p).slice(0, 3);
        if (!skills.length) return '';
        const skillTags = skills.map(s => {
          const sk = (db.skills || []).find(sk2 => sk2['Skill / Specialization'] === s);
          const cat = sk ? sk.Category : 'Other';
          const col = catColor(cat);
          return `<span class="skill-tag" style="background:${col}15; color:${col}; border-color:${col}33">${s}</span>`;
        }).join('');
        return `<div class="person-skills" style="margin-bottom:8px">${skillTags}</div>`;
      }
      
      let val = '';
      let label = '';
      if (k === 'phone') { val = getArray(p, 'Phones')[0] || p['Phone']; label = 'Phone'; }
      else if (k === 'location') { val = p['Location']; label = 'Loc'; }
      else if (k === 'email') { val = getArray(p, 'Emails')[0] || p['Email']; label = 'Email'; }
      else if (k === 'company') { val = p['Current Company']; label = 'Org'; }
      else if (k === 'languages') { val = getArray(p, 'Languages').join(', '); label = 'Lang'; }
      else if (k === 'telegram') { val = getArray(p, 'Telegrams')[0] || p['Telegram']; label = 'TG'; }
      else if (k === 'discord') { val = getArray(p, 'Discords')[0] || p['Discord']; label = 'Discord'; }
      else if (k === 'topics') { val = getArray(p, 'Topics').join(', '); label = 'Topics'; }
      else if (k === 'projects') { val = getArray(p, 'Projects').join(', '); label = 'Projects'; }
      else if (k === 'cadence') {
        const d = nextContactDate(p);
        val = d ? d.toLocaleDateString() : '';
        label = 'Next';
      }
      else if (k === 'where_met') { val = p['Where Met']; label = 'Met'; }
      
      if (!val) return '';
      return `<div style="display:flex; gap:6px; font-size:11.5px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis"><span style="color:var(--muted); min-width:35px">${label}:</span> <span style="overflow:hidden; text-overflow:ellipsis">${val}</span></div>`;
    }).filter(Boolean);

    let finalFieldsHtml = '';
    if (dynHtml.length) {
      finalFieldsHtml = `<div class="person-meta" style="flex-direction:column; gap:4px; align-items:flex-start; margin-top:10px; padding-top:10px; border-top:1px solid var(--border);">
        ${dynHtml.join('')}
      </div>`;
    }

    const hc = healthClass(p);
    return `
      <div class="person-card" data-id="${p['Person ID'] || ''}">
        <div class="health-dot ${hc}" title="Health: ${hc}"></div>
        <div style="display:flex;align-items:flex-start;gap:12px">
          <div class="person-avatar">${p.Picture ? `<img src="${p.Picture}" class="avatar-img">` : initials}</div>
          <div style="flex:1;min-width:0">
            <div class="person-name">${p['Full Name'] || '—'}${p['Preferred Name'] ? ` <span style="color:var(--muted); font-size:12px;">(${p['Preferred Name']})</span>` : ''}</div>
            <div class="person-role">${role}</div>
          </div>
        </div>
        ${finalFieldsHtml}
      </div>`;
  }

  function attachCardListeners() {
    document.querySelectorAll('.person-card').forEach(card => {
      card.addEventListener('click', () => {
        const id = card.dataset.id;
        const person = db.people.find(p => p['Person ID'] === id);
        if (person) openDetailPanel(person);
      });
    });
  }

  function personSkills(p) {
    const raw = p['Specialization'] || p['Current Title'] || '';
    return raw.split(/[,;\/]/).map(s => s.trim()).filter(Boolean);
  }

  // ─── DETAIL PANEL ─────────────────────────────────────────────────
  function openDetailPanel(p) {
    const initials = (p['Full Name'] || '?').split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
    if (p.Picture) {
      document.getElementById('dp-avatar').innerHTML = `<img src="${p.Picture}" class="avatar-img">`;
    } else {
      document.getElementById('dp-avatar').textContent = initials;
    }
    document.getElementById('dp-name').innerHTML = (p['Full Name'] || '—') + (p['Preferred Name'] ? ` <span style="color:var(--muted); font-size:14px; font-weight:500;">(${p['Preferred Name']})</span>` : '');
    document.getElementById('dp-role').textContent = p['Cybersecurity Role'] || p['Current Title'] || '';

    // setup the share button
    document.getElementById('btn-detail-share').onclick = () => {
      navigator.clipboard.writeText(buildShareText(p)).then(() => showToast('Contact copied!'));
    };

    editingPersonId = null;
    document.getElementById('btn-detail-edit').onclick = () => {
      toggleEditMode(p);
    };
    document.getElementById('btn-detail-edit').classList.remove('active');

    let cadenceText = '';
    if (p.Cadence && p.Cadence !== '0') {
      let nDate = nextContactDate(p);

      cadenceText = `Every ${p.Cadence} days (Next: ${dText})`;
    }

    const skillHtml = sList.map(s => {
      const skObj = (db.skills || []).find(x => x['Skill / Specialization'] === s);
      const cat = skObj ? skObj.Category : 'Other';
      const col = catColor(cat);
      return `<div class="dp-skill-pill" style="border-color:${col}22; color:${col}; background:${col}11;">${s}</div>`;
    }).join(' ');

    const formatPills = (arr) => arr.length ? arr.map(a => `<span class="view-pill">${a}</span>`).join('') : '';
    const formatArray = (arr) => arr.length ? arr.join(', ') : '';
    const formatLines = (arr) => arr.length ? arr.join('<br/>') : '';

    const rows = [
      ['Role / Title', p['Cybersecurity Role'] || p['Current Title']],

      ['Email(s)', formatPills(getArray(p, 'Emails')) || (p['Email'] ? `<span class="view-pill">${p['Email']}</span>` : '')],
      ['Location', p['Location']],

      ['LinkedIn', p['LinkedIn'] ? `<a href="${p['LinkedIn']}" target="_blank" style="color:var(--accent);">${p['LinkedIn']}</a>` : ''],
      ['GitHub', p['GitHub'] ? `<a href="${p['GitHub']}" target="_blank" style="color:var(--accent);">${p['GitHub']}</a>` : ''],
      ['Website', p['Website'] ? `<a href="${p['Website']}" target="_blank" style="color:var(--accent);">${p['Website']}</a>` : ''],
      ['Where Met', p['Where Met']],
      ['Topics', formatPills(getArray(p, 'Topics'))],
      ['Projects', formatPills(getArray(p, 'Projects'))],

      ['Interests', p['Interests']],
      ['Context', p['PersonalContext']],
      ['Notes', p['Note'] || p['Notes']],

  // ─── SKILLS VIEW ──────────────────────────────────────────────────
  let draggedSkill = null;

  function renderSkills() {
    const el = document.getElementById('view-skills');
    const byCategory = {};
    (db.skills || []).forEach(s => {
      const cat = s.Category || 'Other';
      if (!byCategory[cat]) byCategory[cat] = [];
      byCategory[cat].push(s['Skill / Specialization']);
    });

    const addCatHtml = `<div style="margin-top:24px;"><button class="btn-primary" onclick="addCategory()">+ New Category</button></div>`;

    el.innerHTML = Object.entries(byCategory).sort((a,b) => b[1].length - a[1].length).map(([cat, skList]) => {
      const col = catColor(cat);
      const encCat = cat.replace(/'/g, "\\'");
      return `
        <div class="skills-cat-section" 
             ondragover="event.preventDefault(); this.classList.add('drop-zone-active')" 
             ondragleave="this.classList.remove('drop-zone-active')"
             ondrop="dropSkill(event, '${encCat}')">
          
          <div class="skills-cat-title" style="color:${col}; display:flex; justify-content:space-between; align-items:center;">
            <div>
              <span ondblclick="renameCategory('${encCat}')" title="Double click to rename" style="cursor:text">${cat}</span>
              <span style="color:var(--muted);font-weight:400;font-size:12px;margin-left:8px;">(${skList.length})</span>
            </div>
            <div>
              <button onclick="addSkillToCat('${encCat}')" class="btn-ghost" style="padding:2px 8px;font-size:12px;">+ Add Skill</button>
              <button onclick="deleteCategory('${encCat}')" class="btn-ghost" style="padding:2px 8px;font-size:12px;color:var(--red);">Delete</button>
            </div>
          </div>
          <div class="skills-list">
            ${skList.map(s => {
              const encS = s.replace(/'/g, "\\'");
              return `
              <div class="skill-pill" draggable="true" 
                   ondragstart="dragStartSkill(event, '${encS}')"
                   style="border-color:${col}22;color:${col}">
                ${s}
                <span class="skill-delete-btn" onclick="deleteSkill('${encS}')">×</span>
              </div>`;
            }).join('')}
          </div>
        </div>`;
    }).join('') + addCatHtml;
  }

  function dragStartSkill(e, skill) {
    draggedSkill = skill;
  }

  async function dropSkill(e, newCat) {
    e.preventDefault();
    e.currentTarget.classList.remove('drop-zone-active');
    if (!draggedSkill) return;
    
    let sk = db.skills.find(x => x['Skill / Specialization'] === draggedSkill);
    if (sk && sk.Category !== newCat) {
      sk.Category = newCat;
      await saveFile();
      renderSkills();
    }
    draggedSkill = null;
  }

  async function addCategory() {
    const name = prompt("Enter new category name:");
    if (!name || name.trim() === "") return;
    const skillName = prompt(`Enter the first skill for '${name}':`);
    if (!skillName || skillName.trim() === "") return;
    if (!db.skills) db.skills = [];
    db.skills.push({ 'Skill / Specialization': skillName.trim(), 'Category': name.trim() });
    await saveFile();
    renderSkills();
  }

  async function addSkillToCat(cat) {
    const name = prompt(`Enter new skill for '${cat}':`);
    if (!name || name.trim() === "") return;
    if (!db.skills) db.skills = [];
    if (db.skills.find(x => x['Skill / Specialization'] === name.trim())) {
      showToast('Skill already exists!'); return;
    }
    db.skills.push({ 'Skill / Specialization': name.trim(), 'Category': cat });
    await saveFile();
    renderSkills();
  }

  async function deleteSkill(name) {
    if(!confirm(`Delete skill '${name}'?`)) return;
    db.skills = db.skills.filter(x => x['Skill / Specialization'] !== name);
    await saveFile();
    renderSkills();
  }

  async function renameCategory(oldCat) {
    const newCat = prompt("Rename category to:", oldCat);
    if (!newCat || newCat.trim() === "" || newCat === oldCat) return;
    db.skills.forEach(s => {
      if (s.Category === oldCat) s.Category = newCat.trim();
    });
    await saveFile();
    renderSkills();
  }

  async function deleteCategory(cat) {
    if(!confirm(`Delete entire category '${cat}' and ALL its skills?`)) return;
    db.skills = db.skills.filter(s => s.Category !== cat);
    await saveFile();
    renderSkills();
  }

  // ─── CRM v2 HELPERS & INTERACTION LOGGER ──────────────────────────
  function daysSince(dateString) {
    if (!dateString) return Infinity;
    return Math.floor((new Date() - new Date(dateString)) / (1000 * 60 * 60 * 24));
  }
  
  function nextContactDate(person) {
    if (!person.Cadence || person.Cadence === '0') return null;
    let interactions = (db.interactions || []).filter(i => i.personId === person['Person ID']);
    interactions.sort((a,b) => new Date(b.date) - new Date(a.date));
    let lastDate = interactions.length ? interactions[0].date : person['Date Added'] || new Date().toISOString();
    let nextDate = new Date(lastDate);
    nextDate.setDate(nextDate.getDate() + parseInt(person.Cadence));
    return nextDate;
  }

  function healthClass(person) {
    if (!person.Cadence || person.Cadence === '0') return 'grey';
    let nextDate = nextContactDate(person);
    let daysLeft = Math.floor((nextDate - new Date()) / (1000 * 60 * 60 * 24));
    if (daysLeft < 0) return 'red';
    if (daysLeft <= 7) return 'amber';
    return 'green';
  }

  function renderInteractions(personId) {
    const list = (db.interactions || []).filter(i => i.personId === personId).sort((a,b) => new Date(b.date) - new Date(a.date));
    const container = document.getElementById('dp-interactions');
    if (!list.length) {
      container.innerHTML = `<div class="empty-msg" style="padding: 20px;">No interactions logged yet.</div><button class="btn btn-primary" style="width:100%" onclick="logInteraction('${personId}')">+ Log Interaction</button>`;
      return;
    }
    container.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h4 style="margin:0;color:var(--text)">Interactions</h4>
        <button class="btn btn-primary" onclick="logInteraction('${personId}')">+ Log</button>
      </div>
      <div class="interaction-list">
        ${list.map(i => `
          <div class="interaction-entry">
            <div class="interaction-meta">
              <span class="interaction-type-badge">${i.type}</span>
              <span class="interaction-date">${new Date(i.date).toLocaleDateString()}</span>
            </div>
            <div style="color:var(--text);margin-top:8px;line-height:1.4;">${i.notes}</div>
          </div>
        `).join('')}
      </div>
    `;
  }

  let currentInteractionPersonId = null;
  function logInteraction(personId) {
    currentInteractionPersonId = personId;
    document.getElementById('int-date').value = new Date().toISOString().split('T')[0];
    document.getElementById('int-notes').value = '';
    document.getElementById('interaction-modal').classList.remove('hidden');
  }

  document.getElementById('btn-save-interaction').addEventListener('click', async () => {
    if (!db.interactions) db.interactions = [];
    const date = document.getElementById('int-date').value;
    const type = document.getElementById('int-type').value;
    const notes = document.getElementById('int-notes').value;
    
    db.interactions.push({
      id: 'INT-' + Date.now(),
      personId: currentInteractionPersonId,
      date, type, notes
    });
    
    document.getElementById('interaction-modal').classList.add('hidden');
    await saveFile();
    renderInteractions(currentInteractionPersonId);
    if(currentView === 'dashboard') renderDashboard();
    if(currentView === 'people') renderPeople();
  });

  // ─── ADD CONTACT MODAL ────────────────────────────────────────────
  function openModal() {
    currentAvatarB64 = null;
    document.getElementById('f-avatar-preview').style.display = 'none';
    document.getElementById('btn-modal-avatar-remove').style.display = 'none';
    document.getElementById('f-avatar-input').value = '';
    // populate skill checkboxes
    const area = document.getElementById('skill-checkboxes');
    area.innerHTML = (db.skills || []).map(s => `
      <label class="skill-checkbox">
        <input type="checkbox" value="${s['Skill / Specialization']}" />
        <span>${s['Skill / Specialization']}</span>
        <span style="margin-left:auto;font-size:10px;color:var(--muted)">${s.Category || ''}</span>
      </label>`).join('');
    document.getElementById('modal-overlay').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    document.getElementById('modal-box').querySelectorAll('input, textarea').forEach(el => el.value = '');
  }

  async function saveContact() {
    const name = document.getElementById('f-name').value.trim();
    if (!name) { document.getElementById('f-name').focus(); return; }

    const checked = [...document.querySelectorAll('#skill-checkboxes input:checked')].map(c => c.value);
    
    // Process website/links
    let website = document.getElementById('f-website').value.trim();
    if(website && !website.startsWith('http')) website = 'https://' + website;
    
    let github = document.getElementById('f-github').value.trim();
    if(github && !github.startsWith('http')) github = 'https://github.com/' + github;
    
    let linkedin = document.getElementById('f-linkedin').value.trim();
    if(linkedin && !linkedin.startsWith('http')) linkedin = 'https://linkedin.com/in/' + linkedin;

    const parseComma = (str) => str.split(',').map(s=>s.trim()).filter(Boolean);

    const newPerson = {
      'Person ID': 'P-' + Date.now(),
      'Full Name': name,
      'Preferred Name': document.getElementById('f-nickname').value.trim(),
      'Cybersecurity Role': document.getElementById('f-role').value.trim(),
      'Location': document.getElementById('f-location').value.trim(),
      'Phones': parseComma(document.getElementById('f-phones').value),
      'Emails': parseComma(document.getElementById('f-emails').value),
      'Telegrams': parseComma(document.getElementById('f-telegrams').value),
      'Discords': parseComma(document.getElementById('f-discords').value),
      'Languages': parseComma(document.getElementById('f-languages').value),
      'Topics': parseComma(document.getElementById('f-topics').value),
      'Projects': parseComma(document.getElementById('f-projects').value),
      'Website': website,
      'GitHub': github,
      'LinkedIn': linkedin,
      'Where Met': document.getElementById('f-met').value.trim(),
      'Specialization': checked.join(', '),
      'Cadence': document.getElementById('f-cadence').value,
      'Goals': document.getElementById('f-goals').value.trim(),
      'Interests': document.getElementById('f-interests').value.trim(),
      'PersonalContext': document.getElementById('f-context').value.trim(),
      'Note': document.getElementById('f-notes').value.trim(),
      'Date Added': new Date().toISOString()
    };

    // Remove empty fields
    Object.keys(newPerson).forEach(k => { 
      if (Array.isArray(newPerson[k]) && newPerson[k].length === 0) delete newPerson[k];
      else if (!newPerson[k] && newPerson[k] !== 0) delete newPerson[k]; 
    });

    db.people.unshift(newPerson);
    await saveFile();
    closeModal();
    renderView(currentView);
  }

      currentAvatarB64 = await processImageUpload(e.target.files[0]);
      const preview = document.getElementById('f-avatar-preview');
      preview.src = currentAvatarB64;
      preview.style.display = 'block';
      document.getElementById('btn-modal-avatar-remove').style.display = 'inline-block';

      console.log(err);
    }

    currentAvatarB64 = null;

    btn.addEventListener('click', () => renderView(btn.dataset.view));
  });

  document.getElementById('search-input').addEventListener('input', e => {
    searchQuery = e.target.value;
    if (currentView === 'people') renderPeople();
  });

  // Close detail panel on overlay click
  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target.id === 'modal-overlay') closeModal();
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('.field-chooser-wrapper')) {
      document.querySelectorAll('.field-chooser-panel.open').forEach(p => p.classList.remove('open'));
    }
  });

  
  (async function initApp() {
    const storedHandle = await getHandleFromIDB();
    if (storedHandle) {
      fileHandle = storedHandle;
      const resumeBtn = document.getElementById('btn-resume-session');
      const loadBtn = document.getElementById('btn-load-onboard');
      
      // We have a stored handle, so show resume and fade load button
      resumeBtn.style.display = 'inline-block';
      loadBtn.textContent = 'Select Different File';
      
      resumeBtn.onclick = async () => {
        try {
          if ((await fileHandle.queryPermission({mode: 'readwrite'})) !== 'granted') {
            const perm = await fileHandle.requestPermission({mode: 'readwrite'});
            if (perm !== 'granted') return;
          }
          await readAndBootFile();
        } catch (e) {
          console.error(e);
          resumeBtn.style.display = 'none';
        }
      };
    }
  })();

  // Initial: hide search on dashboard
  document.getElementById('search-input').style.display = 'none';
  </script>
</body>
</html>
